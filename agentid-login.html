<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101214" />
    <title>Continue with AgentID — AshisDigitalHub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-entry-page">
    <main class="auth-entry" aria-labelledby="auth-entry-title">
      <span class="eyebrow"><span class="status-dot"></span> Secure identity channel</span>
      <h1 id="auth-entry-title">Continue with <em>AgentID.</em></h1>
      <p id="auth-entry-status">Preparing your secure sign-in…</p>
      <a class="text-link" href="./">Return to AshisDigitalHub <span aria-hidden="true">↗</span></a>
    </main>
    <script src="public/auth-config.js"></script>
    <script type="module">
      const config = window.ADH_AUTH_CONFIG || {};
      const status = document.querySelector('#auth-entry-status');
      const loginHint = new URLSearchParams(location.search).get('login_hint');
      const ready = config.supabaseUrl && config.supabaseAnonKey && !config.supabaseUrl.includes('YOUR_PROJECT_REF');

      if (!ready) {
        status.textContent = 'Supabase configuration is required before AgentID sign-in can start.';
      } else {
        import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm').then(async ({ createClient }) => {
          const supabase = createClient(config.supabaseUrl, config.supabaseAnonKey);
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'agentid',
            options: {
              redirectTo: `${location.origin}${location.pathname.replace(/agentid-login\.html$/, '')}`,
              queryParams: loginHint ? { login_hint: loginHint } : undefined
            }
          });
          if (error) status.textContent = `Unable to start sign-in: ${error.message}`;
        }).catch(() => {
          status.textContent = 'Authentication service could not load. Please try again.';
        });
      }
    </script>
  </body>
</html>
